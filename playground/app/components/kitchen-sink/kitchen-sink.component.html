<fs-country code="CA" region="Ontario"></fs-country>
<br><br>

<table class="table three-col-example">
  <thead>
    <tr>
      <th>Name</th>
      <th>Code</th>
      <th>Flag</th>
      <th align="left">Phone Code</th>
      <th align="left">Country</th>
    </tr>
  </thead>
  @for (country of countryService.countries$ | async; track country) {
    <tr>
      <td style="width: 200px"> {{ country.name }}</td>
      <td style="text-align: center"> {{ country.isoCode }}</td>
      <td style="text-align: center">
        <fs-country-flag [code]="country.isoCode"></fs-country-flag>
      </td>
      <td>
        @if (!!country.countryCode) {
          <fs-country-phone-code [code]="country.isoCode"></fs-country-phone-code>
        } @else {
          -
        }
      </td>
      <td style="text-align: left">
        <fs-country [code]="country.isoCode"></fs-country>
      </td>
    </tr>
  }
</table>
